<figure><img src="fig02_scan_error_vs_casci.svg"><figcaption><b>FIGURE 2. Correlation recovery along the asymmetric stretch</b><br>Three geometry points only. No values between the sampled geometries are inferred.</figcaption></figure>
<figure><img src="fig03_accuracy_resource_pareto.svg"><figcaption><b>FIGURE 3. Accuracy–entangling-resource trade-off</b><br>CX counts are level-3 transpiler estimates. Min–max spans two starts (n=2), not a confidence interval.</figcaption></figure>
<figure><img src="fig04_ansatz_resource_scaling.svg"><figcaption><b>FIGURE 4. Circuit-resource growth with paired-ansatz repetitions</b><br>Counts are from the recorded level-3 compilation of the logical circuit, not hardware-routed execution.</figcaption></figure>
<figure><img src="fig05_ansatz_restart_spread.svg"><figcaption><b>FIGURE 5. Observed restart-to-restart variability</b><br>Two starts per configuration only (n=2); observed range is not a confidence interval or a global-minimum guarantee.</figcaption></figure>
<figure><img src="fig06_ansatz_convergence.svg"><figcaption><b>FIGURE 6. Optimization traces under a fixed evaluation cap</b><br>The pilot used a 150-objective-evaluation cap. Gradient evaluations and wall-clock cost are not represented by this x-axis.</figcaption></figure>
<figure><img src="fig07_optimizer_outcomes.svg"><figcaption><b>FIGURE 7. Held-out optimizer outcomes for PUCCSD(1)</b><br>Ten starts per optimizer. Results use ideal statevector objectives; evaluation count is not equal to wall-clock or hardware cost.</figcaption></figure>
<figure><img src="fig08_optimizer_budget_convergence.svg"><figcaption><b>FIGURE 8. Optimizer convergence at common evaluation checkpoints</b><br>Objective evaluations are a budget proxy. Exact gradients, their cost, and elapsed time differ across optimizers.</figcaption></figure>
<figure><img src="fig09_spsa_tuning_heatmap.svg"><figcaption><b>FIGURE 9. SPSA calibration grid: development-stage results</b><br>Tuning data only, not held-out performance. The selected auto-calibration schedule is run-dependent.</figcaption></figure>
<figure><img src="fig10_adapt_macrocycle_progress.svg"><figcaption><b>FIGURE 10. Fermionic ADAPT-VQE: progress through the interrupted run</b><br>The run stopped after 11 of 16 requested cycles. Final recorded error: 3.473 mHa vs active-space CASCI; chemical accuracy was not reached.</figcaption></figure>
<figure><img src="fig11_synthetic_noise_uncertainty.svg"><figcaption><b>FIGURE 11. Low-shot synthetic noise: uncertainty overwhelms the ideal error</b><br>PUCCSD(1), 10 mapped qubits; 4,416 shots total. Synthetic noise p₁=10⁻⁴, p₂=10⁻³, symmetric readout flip=1%. Noisy estimate error +789.3 mHa ±570.4 mHa (one propagated sampling SE, one seed); this is too imprecise to support a chemical-accuracy claim.</figcaption></figure>
